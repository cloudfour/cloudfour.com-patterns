name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Use Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Run Build
        run: npm run build

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Use Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Run Preprocess
        run: npm run preprocess
      - name: Run Lint
        run: npm run lint:check
      - name: Run Type Checker
        run: npm run type

  build-storybook:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Use Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Run Build
        run: npm run build-storybook

  test:
    runs-on: ubuntu-latest
    # Every job normally finishes in under two minutes. The caps stop a hung job
    # from running until GitHub's six-hour default timeout, which has happened
    # here when the Ubuntu package mirror that `playwright install --with-deps`
    # downloads from stalled. This job's cap is higher than the others because
    # a slow-but-working mirror can take around 10 minutes, and that should
    # still pass rather than fail.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Use Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      # Chromium is not in the npm install: Playwright downloads browsers
      # separately. We deliberately do NOT cache them, per Playwright's own CI
      # guidance (https://playwright.dev/docs/ci) — restoring the cache costs
      # about as much as downloading.
      #
      # We skip `--with-deps`. The ubuntu-latest image ships Google Chrome, so
      # the system libraries Chromium needs are already installed. The flag
      # would add ~25 MB of fonts from Ubuntu's package mirror, which sometimes
      # slows to a crawl and has stretched this step from seconds to 10+ minutes.
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Run Preprocess
        run: npm run preprocess
      - name: Run Build (necessary for including css file in tests)
        run: npm run build
      - name: Run Tests
        run: npm run test
