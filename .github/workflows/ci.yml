name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Use Node.js 24
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.19.0
      - name: Cache node modules
        uses: actions/cache@v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-
      - name: Install Dependencies
        run: npm ci
      - name: Run Preprocess
        run: npm run preprocess
      - name: Run Lint
        run: npm run lint:check
      - name: Run Type Checker
        run: npm run type

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Use Node.js 24
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.19.0
      - name: Cache node modules
        uses: actions/cache@v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-
      - name: Install Dependencies
        run: npm ci
      - name: Run Build
        run: npm run build

  build-storybook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Use Node.js 24
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.19.0
      - name: Cache node modules
        uses: actions/cache@v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-
      - name: Install Dependencies
        run: npm ci
      - name: Run Build
        run: npm run build-storybook

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Use Node.js 24
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.19.0
      - name: Cache node modules
        uses: actions/cache@v6.1.0
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-
      - name: Install Dependencies
        run: npm ci
      # Chromium is not in the npm install: Playwright downloads browsers
      # separately, into a cache keyed by Playwright version.
      - name: Cache Playwright browsers
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
      # Skips the download on a cache hit, but still installs the system
      # libraries Chromium needs, which are not cached.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Preprocess
        run: npm run preprocess
      - name: Run Build (necessary for including css file in tests)
        run: npm run build
      - name: Run Tests
        run: npm run test
